# Overlay for the official Dify compose file.
#
# Compose resolves relative build contexts against the *project* directory (the
# directory of the first -f file), not against this file, so the repository root
# is passed explicitly instead of guessed:
#
#   export LETHE_REPO=/absolute/path/to/this-repo
#   cd <dify-checkout>/docker
#   docker compose \
#     -f docker-compose.yaml \
#     -f "$LETHE_REPO/dify/deploy/docker-compose.lethe.yaml" \
#     up -d
#
# The default network subnet is pinned so that SSRF_PROXY_ALLOW_PRIVATE_IPS can
# name a deterministic range instead of guessing Docker's automatic 172.17-31
# assignment.
services:
  lethe-powercontext:
    build:
      context: ${LETHE_REPO:?set LETHE_REPO to the absolute path of this repository}
      dockerfile: dify/deploy/powercontext.Dockerfile
    restart: unless-stopped
    environment:
      POWERCONTEXT_HOME: /data
    volumes:
      - lethe-powercontext-data:/data
    ports:
      # Loopback only: the bridge is the intended client, this is for inspection.
      - "127.0.0.1:${LETHE_POWERCONTEXT_PORT:-18000}:8000"
    healthcheck:
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  lethe-bridge:
    build:
      context: ${LETHE_REPO:?set LETHE_REPO to the absolute path of this repository}/dify/bridge
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POWERCONTEXT_URL: http://lethe-powercontext:8000
      LETHE_MEMORY_LIMIT: "24"
      LETHE_MEMORY_CHARS: "4000"
      LETHE_LOG_LEVEL: INFO
    depends_on:
      lethe-powercontext:
        condition: service_healthy
    ports:
      # Loopback only, so the verification script can inspect memory state.
      - "127.0.0.1:${LETHE_BRIDGE_PORT:-8081}:8080"
    healthcheck:
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6

  # Scripted stand-in for a chat model, used only when no real provider is
  # configured. It is a plain HTTP service, not a model; see deploy/model_stub.
  lethe-model-stub:
    build:
      context: ${LETHE_REPO:?set LETHE_REPO to the absolute path of this repository}/dify/deploy/model_stub
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      STUB_MODEL_NAME: lethe-npc
    healthcheck:
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 6

volumes:
  lethe-powercontext-data:

networks:
  default:
    ipam:
      config:
        - subnet: ${LETHE_DOCKER_SUBNET:-172.28.0.0/16}
